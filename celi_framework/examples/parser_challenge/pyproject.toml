[project]
name = "parser-challenge"
version = "0.1.0"
description = "Parser Challenge Example for CELI Framework"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.54.0",
    "python-levenshtein>=0.25.1", 
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "aioboto3>=13.0.0",
    "pandas>=2.0.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"